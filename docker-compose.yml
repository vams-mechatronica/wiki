# Docmost - open-source collaborative wiki (https://github.com/docmost/docmost)
# Values come from .env (generated by Jenkins at deploy time, see .env.example).
name: ${COMPOSE_PROJECT_NAME:-docmost}

services:
  docmost:
    image: docmost/docmost:${DOCMOST_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-docmost}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-docmost}?schema=public
      REDIS_URL: redis://redis:6379
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Docmost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    # Public traffic arrives via the shared edge nginx (api-services repo,
    # wiki.thenearbyshop.com -> docmost-wiki:3000 on webnet). The host port is
    # bound to localhost only, for debugging on the server.
    ports:
      - "${DOCMOST_BIND:-127.0.0.1}:${DOCMOST_PORT:-3000}:3000"
    volumes:
      - docmost_data:/app/data/storage
    networks:
      default:
      webnet:
        aliases:
          - docmost-wiki

  db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docmost}
      POSTGRES_USER: ${POSTGRES_USER:-docmost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:${REDIS_VERSION:-7.2-alpine}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  docmost_data:
  db_data:
  redis_data:

networks:
  # Shared external network of the edge nginx (created once on the server:
  # `docker network create webnet`). Only the docmost container joins it;
  # Postgres and Redis stay on the project's private default network.
  webnet:
    external: true
    name: ${EDGE_NETWORK:-webnet}
